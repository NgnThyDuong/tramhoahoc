<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | Trạm Hoá Học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login/login.css" />
</head>
<body>
  <main class="page-shell">
    <!-- Thanh điều hướng trên cùng -->
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Trang chủ Trạm Hoá Học">
        <img class="placeholder logo-placeholder" src="image/logo.png" alt="Logo Trạm Hoá Học" />
        <span>Trạm Hoá Học</span>
      </a>
      <nav class="nav-actions" aria-label="Điều hướng chính">
        <button class="icon-button search-button" type="button" aria-label="Tìm kiếm">⌕</button>
        <button class="icon-button menu-button" type="button" aria-label="Mở menu">☰</button>
      </nav>
    </header>

    <!-- Ảnh Illustration trang trí xung quanh nền -->
    <img class="decor decor-atom" src="login/image/atom.png" alt="Nguyên tử" />
    <img class="decor decor-tube" src="login/image/tube.png" alt="Ống nghiệm nghiêng" />
    <img class="decor decor-star-top" src="login/image/star-green.png" alt="Ngôi sao xanh" />
    <img class="decor decor-heart-top" src="login/image/heart.png" alt="Trái tim" />
    <img class="decor decor-molecule-right" src="login/image/molecule.png" alt="Phân tử" />

    <!-- Khung đăng nhập chính -->
    <section class="login-section" id="login" aria-labelledby="login-title">
      <div class="login-card">
        <!-- Bình thí nghiệm cute đè lên mép trên -->
        <img
          class="hero-flask"
          src="login/image/login.png"
          alt="Minh hoạ bình thí nghiệm"
        />

        <h1 id="login-title">
          <span class="spark-mark">ヾ</span>
          Đăng nhập
          <span class="spark-mark">ﾉ</span>
        </h1>
        <p class="welcome">Chào mừng bạn quay lại!<br />Cùng tiếp tục hành trình khám phá hoá học nhé!</p>
        
        <div class="heart-divider">♡</div>

        <form class="login-form" action="#" method="post">
          <!-- Ô Tên đăng nhập -->
          <label class="input-wrap">
            <span class="field-icon user-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2z"></path>
              </svg>
            </span>
            <input 
              type="text" 
              name="username" 
              placeholder="Tên đăng nhập" 
              autocomplete="username" 
              required 
            />
          </label>

          <!-- Ô Mật khẩu -->
          <label class="input-wrap">
            <span class="field-icon lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="4" y="10" width="16" height="12" rx="2.5"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <circle cx="12" cy="15.5" r="1"></circle>
                <path d="M12 16.5v2"></path>
              </svg>
            </span>
            <input 
              type="password" 
              name="password" 
              placeholder="Mật khẩu" 
              autocomplete="current-password" 
              required 
            />
            <button 
              class="password-toggle" 
              type="button" 
              aria-label="Hiển thị mật khẩu"
            >
               <svg viewBox="0 0 24 24">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M3 21 21 3"></path>
               </svg>
            </button>
          </label>

          <button class="submit-button" type="submit">Đăng nhập <span>→</span></button>
        </form>

        <p class="signup">Bạn chưa có tài khoản? <a href="register.html">Đăng ký ngay</a> <span>✦</span></p>
      </div>
    </section>

    <!-- Chân trang -->
    <footer class="footer">
      <img class="placeholder footer-art books-art" src="login/image/footer1.png" alt="Minh hoạ chú thú trên sách" />
      <div class="footer-decoration">✦</div>
      <img class="placeholder footer-art flask-art" src="login/image/footer2.png" alt="Minh hoạ bình hoá chất" />
    </footer>
  </main>

  <script src="login/login.js"></script>
</body>
</html>
